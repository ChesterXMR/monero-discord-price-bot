name = "monero-price-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Schedule is OFF because the always-on bot in ../bot runs on a VM and owns the
# nickname. To use the Worker instead, set:  crons = ["* * * * *"]
# (fires once a minute; each run then loops for ~55 s, updating every UPDATE_INTERVAL seconds).
[triggers]
crons = []

[vars]
# Optional. Leave empty to update every server the bot has been added to.
# Set comma-separated server IDs to restrict it to specific servers.
GUILD_IDS = ""
# Kraken pair: XMRUSD, XMREUR, XMRXBT ...
PAIR = "XMRUSD"
# Seconds between nickname updates inside each one-minute run. 15 is a safe
# default; below ~10 Discord starts rate limiting the nickname route.
UPDATE_INTERVAL = "15"

# DISCORD_TOKEN is a secret, not a var:  npx wrangler secret put DISCORD_TOKEN
